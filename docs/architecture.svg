<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">Serverless Grocery — AWS target architecture</title>
  <desc id="desc">Four household users load static assets through CloudFront from private S3, sign in with Cognito using authorization code and PKCE, and call a JWT-protected API Gateway HTTP API. Gateway invokes private Python domain Lambdas that read and write one shared-household DynamoDB table. Cognito household group membership is checked in Lambda. IAM controls permissions, CloudWatch provides telemetry, and SAM provisions the stack. Regional services use us-east-1. Dev stack deployed; authenticated acceptance and production remain pending.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#334155"/></marker>
    <marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker>
    <style>
      text {font-family:Arial,Helvetica,sans-serif;fill:#0f172a}
      .title {font-size:28px;font-weight:700}
      .heading {font-size:18px;font-weight:700}
      .body {font-size:15px}
      .small {font-size:13px;fill:#475569}
      .card {fill:white;stroke:#cbd5e1;stroke-width:2}
      .flow {fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
      .support {fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#muted)}
    </style>
  </defs>
  <rect width="1440" height="1040" fill="#f8fafc"/>
  <text x="40" y="48" class="title">Serverless Grocery • AWS target architecture</text>
  <text x="40" y="76" class="body">Dev deployed • 1,943 records migrated • frontend live • invitations/acceptance pending</text>
  <rect x="345" y="105" width="1060" height="730" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="365" y="135" class="heading">AWS • one isolated stack per environment</text>
  <text x="365" y="158" class="small">CloudFront: global | Regional services: us-east-1</text>

  <rect x="35" y="215" width="250" height="390" rx="12" class="card"/>
  <rect x="55" y="235" width="210" height="42" rx="6" fill="#e2e8f0"/>
  <text x="160" y="262" text-anchor="middle" class="heading">Phone / desktop</text>
  <text x="60" y="310" class="body">Browser application</text>
  <text x="60" y="340" class="small">HTML / CSS / JavaScript</text>
  <text x="60" y="365" class="small">Responsive grocery screens</text>
  <text x="60" y="410" class="small">PKCE login + token handling</text>
  <text x="60" y="435" class="small">Authenticated API calls</text>
  <text x="60" y="485" class="small">No AWS credentials</text>
  <text x="60" y="510" class="small">No direct database access</text>
  <text x="60" y="565" class="small">Online use assumed initially</text>

  <rect x="400" y="195" width="280" height="115" rx="10" class="card"/>
  <rect x="400" y="195" width="8" height="115" fill="#8c4fff"/>
  <text x="425" y="228" class="heading">Amazon CloudFront</text>
  <text x="425" y="256" class="body">HTTPS static delivery</text>
  <text x="425" y="282" class="small">Security headers + asset caching</text>
  <rect x="945" y="195" width="400" height="115" rx="10" class="card"/>
  <rect x="945" y="195" width="8" height="115" fill="#7aa116"/>
  <text x="970" y="228" class="heading">Amazon S3 • private bucket</text>
  <text x="970" y="256" class="body">index.html / styles.css / JS / config</text>
  <text x="970" y="282" class="small">Block public access; versioned releases</text>
  <path d="M285 252 H400" class="flow"/>
  <text x="300" y="237" class="small">1. HTTPS</text>
  <path d="M680 252 H945" class="flow"/>
  <text x="710" y="235" class="small">OAC signed origin requests</text>

  <rect x="400" y="365" width="360" height="110" rx="10" class="card"/>
  <rect x="400" y="365" width="8" height="110" fill="#dd344c"/>
  <text x="425" y="397" class="heading">Amazon Cognito</text>
  <text x="425" y="425" class="body">Managed login • code + PKCE</text>
  <text x="425" y="451" class="small">4 invited users; refresh lifetime up to 3650 days</text>
  <path d="M285 420 H400" class="flow" marker-start="url(#arrow)"/>
  <text x="295" y="401" class="small">2. Sign in</text>
  <text x="810" y="395" class="body">Browser receives tokens after sign-in.</text>
  <text x="810" y="423" class="small">Cognito is not a proxy for application API calls.</text>
  <text x="810" y="451" class="small">Gateway validates JWTs; Lambda checks household group.</text>

  <rect x="400" y="530" width="270" height="135" rx="10" class="card"/>
  <rect x="400" y="530" width="8" height="135" fill="#8c4fff"/>
  <text x="425" y="562" class="heading">API Gateway</text>
  <text x="425" y="589" class="body">HTTP API • JWT authorizer</text>
  <text x="425" y="616" class="small">Required read/write scopes</text>
  <text x="425" y="643" class="small">Exact-origin CORS; open OPTIONS</text>
  <path d="M285 580 H400" class="flow"/>
  <text x="296" y="551" class="small">3. HTTPS</text>
  <text x="296" y="568" class="small">Bearer token</text>

  <rect x="765" y="530" width="290" height="135" rx="10" class="card"/>
  <rect x="765" y="530" width="8" height="135" fill="#ed7100"/>
  <text x="790" y="562" class="heading">AWS Lambda • Python</text>
  <text x="790" y="589" class="body">Inventory / locations</text>
  <text x="790" y="616" class="body">Shopping / impromptu</text>
  <text x="790" y="643" class="body">Meals</text>
  <path d="M670 585 H765" class="flow"/>
  <text x="682" y="569" class="small">4. Invoke</text>

  <rect x="1150" y="530" width="225" height="135" rx="10" class="card"/>
  <rect x="1150" y="530" width="8" height="135" fill="#c925d1"/>
  <text x="1170" y="562" class="heading">Amazon DynamoDB</text>
  <text x="1170" y="589" class="body">One application table</text>
  <text x="1170" y="616" class="small">On-demand • pk + sk</text>
  <text x="1170" y="643" class="small">Recovery + retention</text>
  <path d="M1055 585 H1150" class="flow"/>
  <text x="1065" y="554" class="small">5. Scoped</text>
  <text x="1065" y="571" class="small">read/write</text>

  <rect x="400" y="720" width="270" height="80" rx="10" class="card"/>
  <text x="425" y="751" class="heading">IAM execution roles</text>
  <text x="425" y="778" class="small">Least privilege • table + log access</text>
  <path d="M670 759 H815 V665" class="support"/>
  <text x="685" y="744" class="small">permissions</text>
  <rect x="955" y="720" width="390" height="80" rx="10" class="card"/>
  <text x="980" y="751" class="heading">Amazon CloudWatch</text>
  <text x="980" y="778" class="small">API access / Lambda logs</text>
  <path d="M1005 665 V695 H1110 V720" class="support"/>
  <text x="1125" y="701" class="small">telemetry</text>

  <rect x="35" y="865" width="1370" height="130" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="895" class="heading">Dev is live • production approval remains separate</text>
  <text x="60" y="924" class="body">Sput/serverless_grocery → tests → SAM / CloudFormation → AWS (separate dev/prod recommended)</text>
  <text x="60" y="950" class="small">Dev migration and static release complete. Production requires separate approval; alarms deferred.</text>
  <text x="60" y="978" class="small">ChatGPT meal access is a proposal only; its public endpoint has been removed pending owner approval.</text>
</svg>
